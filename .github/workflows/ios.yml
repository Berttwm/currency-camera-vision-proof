name: Identical-pixel Mac and iOS Simulator proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ios-static-proof
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record actual host and installed Simulator inventory
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun swiftc --version
          xcrun simctl list --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          inventory = json.loads(Path(os.environ['RUNNER_TEMP'], 'simulators.json').read_text())
          choices = []
          for runtime in inventory['runtimes']:
              if not runtime.get('isAvailable') or not runtime['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-'):
                  continue
              version = tuple(map(int, runtime['version'].split('.')))
              if version[0] != 26:
                  continue
              for device in inventory['devices'].get(runtime['identifier'], []):
                  if device.get('isAvailable') and device['name'].startswith('iPhone') and device['state'] == 'Shutdown':
                      choices.append((version, device['name'] == 'iPhone 17', runtime, device))
          assert choices, 'No available installed iOS26 iPhone Simulator; do not download or pay'
          _, _, runtime, device = max(choices, key=lambda x: (x[0], x[1], x[3]['name']))
          print(json.dumps({'runtime': runtime, 'device': device}, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('PROOF_SIMULATOR=' + device['udid'] + '\n')
          PY
      - name: Render public PDFs once and read the exact bytes on Mac
        run: |
          xcrun swiftc -O -swift-version 5 -target "$(uname -m)-apple-macosx13.0" -framework Vision -framework CoreGraphics -framework CoreText -framework PDFKit -framework CryptoKit -framework DataDetection main.swift Proof.swift -o "$RUNNER_TEMP/mac-proof"
          "$RUNNER_TEMP/mac-proof" "$PWD/Inputs" > "$RUNNER_TEMP/mac-result.json"
          echo CURRENCY_CAMERA_MAC_JSON_BEGIN
          cat "$RUNNER_TEMP/mac-result.json"
          printf '\nCURRENCY_CAMERA_MAC_JSON_END\n'
      - name: Read separate document layout on Mac after preserving baseline
        run: |
          "$RUNNER_TEMP/mac-proof" --documents "$PWD/Inputs" > "$RUNNER_TEMP/mac-document.json"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'mac-document.json'
          assert path.stat().st_size < 16_000_000, 'Decoded Mac document limit'
          data = path.read_bytes()
          encoded = base64.b64encode(gzip.compress(data, mtime=0)).decode('ascii')
          envelope = {'encoding': 'gzip+base64', 'decodedBytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                      'base64': [encoded[i:i+4096] for i in range(0, len(encoded), 4096)]}
          wire = json.dumps(envelope, indent=2)
          assert len(wire.encode('utf8')) + Path('Inputs/baseline-mac.json').stat().st_size < 4_000_000, 'Combined Mac wire limit'
          print('CURRENCY_CAMERA_DOCUMENT_MAC_JSON_BEGIN')
          print(wire)
          print('CURRENCY_CAMERA_DOCUMENT_MAC_JSON_END')
          PY
      - name: Build the Simulator app without account or provisioning changes
        run: |
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          # Explicit input plist: custom INFOPLIST_KEY settings were not embedded by Xcode.
          metadata = {
              'CFBundleInfoDictionaryVersion': '6.0', 'CFBundleIdentifier': 'org.currencycamera.visionproof',
              'CFBundleExecutable': 'VisionProof', 'CFBundleName': 'VisionProof', 'CFBundlePackageType': 'APPL',
              'CFBundleVersion': '1', 'CFBundleShortVersionString': '1.0', 'LSRequiresIPhoneOS': True,
              'UIDeviceFamily': [1], 'UILaunchScreen': {}, 'UISupportedInterfaceOrientations': ['UIInterfaceOrientationPortrait'],
              'ProofSourceRevision': os.environ['GITHUB_SHA'],
              'ProofRunIdentity': os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'],
          }
          with (Path(os.environ['RUNNER_TEMP']) / 'proof-info.plist').open('xb') as output:
              plistlib.dump(metadata, output, fmt=plistlib.FMT_XML)
          PY
          if ! xcodebuild -project VisionProof.xcodeproj -scheme VisionProof -configuration Release -sdk iphonesimulator -destination "platform=iOS Simulator,id=$PROOF_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/derived" GENERATE_INFOPLIST_FILE=NO "INFOPLIST_FILE=$RUNNER_TEMP/proof-info.plist" build > "$RUNNER_TEMP/build.log" 2>&1; then
            tail -n 200 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/build.log"
      - name: Run iOS inference and verify identical menu bytes
        run: |
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path
          plist = plistlib.loads((Path(os.environ['RUNNER_TEMP']) / 'derived/Build/Products/Release-iphonesimulator/VisionProof.app/Info.plist').read_bytes())
          keys = ['CFBundleIdentifier', 'CFBundleVersion', 'CFBundleShortVersionString', 'ProofRunIdentity', 'ProofSourceRevision']
          print('CURRENCY_CAMERA_BUILT_METADATA ' + json.dumps({key: plist.get(key) for key in keys}), flush=True)
          assert plist.get('CFBundleIdentifier') == 'org.currencycamera.visionproof'
          assert plist.get('CFBundleVersion') == '1' and plist.get('CFBundleShortVersionString') == '1.0'
          assert plist.get('ProofRunIdentity') == os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'], 'Missing/wrong built run identity'
          assert plist.get('ProofSourceRevision') == os.environ['GITHUB_SHA'], 'Missing/wrong built source revision'
          PY
          xcrun simctl help bootstatus
          xcrun simctl boot "$PROOF_SIMULATOR"
          xcrun simctl bootstatus "$PROOF_SIMULATOR" -b
          xcrun simctl install "$PROOF_SIMULATOR" "$RUNNER_TEMP/derived/Build/Products/Release-iphonesimulator/VisionProof.app"
          xcrun simctl launch "$PROOF_SIMULATOR" org.currencycamera.visionproof
          xcrun simctl get_app_container "$PROOF_SIMULATOR" org.currencycamera.visionproof data > "$RUNNER_TEMP/container-path"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, plistlib, subprocess, time
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          identity = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          result_path = Path((temp / 'container-path').read_text().strip()) / 'Documents' / ('result-' + identity + '.json')
          progress_path = result_path.with_name('progress-' + identity + '.json')
          deadline = time.monotonic() + 180
          last_progress = None
          while not result_path.exists() and time.monotonic() < deadline:
              if progress_path.exists():
                  assert progress_path.stat().st_size < 8192, 'Oversized progress record'
                  progress = json.loads(progress_path.read_text())
                  assert progress['runIdentity'] == identity, 'Wrong progress invocation'
                  if progress != last_progress:
                      print('CURRENCY_CAMERA_APP_PROGRESS ' + json.dumps(progress), flush=True)
                      last_progress = progress
              time.sleep(1)
          if not result_path.exists():
              # Only this ephemeral test app's process/logs; no general environment dump.
              processes = subprocess.run(['ps', '-axo', 'pid,etime,state,comm'], capture_output=True, text=True, timeout=10)
              print('CURRENCY_CAMERA_APP_PROCESS ' + '\n'.join(line for line in processes.stdout.splitlines() if line.rstrip().endswith('/VisionProof')))
              simulator = os.environ['PROOF_SIMULATOR']
              try:
                  diagnostic = subprocess.run(['xcrun', 'simctl', 'spawn', simulator, 'log', 'show', '--last', '5m', '--style', 'compact', '--predicate', 'process == "VisionProof"'], capture_output=True, text=True, timeout=20)
                  print('CURRENCY_CAMERA_APP_LOG ' + diagnostic.stdout[-40000:])
              except subprocess.TimeoutExpired:
                  print('CURRENCY_CAMERA_APP_LOG timed out')
              crash_roots = [Path.home() / 'Library/Logs/DiagnosticReports', Path.home() / 'Library/Developer/CoreSimulator/Devices' / simulator / 'data/Library/Logs/CrashReporter']
              for crash_root in crash_roots:
                  for crash in sorted(crash_root.glob('VisionProof*'), key=lambda p: p.stat().st_mtime, reverse=True)[:2]:
                      if crash.is_file():
                          print('CURRENCY_CAMERA_APP_CRASH ' + crash.name + '\n' + crash.read_text(errors='replace')[:40000])
              raise AssertionError('iOS result missing; launch is not inference success')
          assert result_path.stat().st_size < 4_000_000, 'iOS result exceeds log cap'
          ios = json.loads(result_path.read_text())
          print('CURRENCY_CAMERA_IOS_JSON_BEGIN')
          print(result_path.read_text())
          print('CURRENCY_CAMERA_IOS_JSON_END')
          assert ios.get('complete') is True, ios
          assert ios['platform'] == 'iOS Simulator' and ios['operatingSystem'].startswith('Version 26.'), 'Wrong runtime'
          assert ios['sourceRevision'] == os.environ['GITHUB_SHA'], 'Wrong app source revision'
          mac = json.loads((temp / 'mac-result.json').read_text())
          assert mac['runIdentity'] == ios['runIdentity'] == identity, 'Stale/wrong invocation'
          assert mac['inputManifestSha256'] == ios['inputManifestSha256'] == hashlib.sha256(Path('Inputs/inputs.json').read_bytes()).hexdigest()
          plist = plistlib.loads((temp / 'derived/Build/Products/Release-iphonesimulator/VisionProof.app/Info.plist').read_bytes())
          assert plist['CFBundleVersion'] == '1' and plist['CFBundleShortVersionString'] == '1.0'
          assert plist['ProofRunIdentity'] == identity and plist['ProofSourceRevision'] == os.environ['GITHUB_SHA']
          assert mac['complete'] is True and len(mac['pages']) == len(ios['pages']) == 3
          assert mac['colorSpace'] == ios['colorSpace'] == 'DeviceRGB'
          for a, b in zip(mac['pages'], ios['pages']):
              assert a['id'] == b['id'] and a['render'] == b['render'], 'Pixel metadata differs'
              assert a['inputBytesVerified'] is True and b['inputBytesVerified'] is True
          print('Same raw RGBA8 bytes verified on both platforms. Static result only; accuracy is scored separately.')
          document_path = result_path.with_name('document-result-' + identity + '.json')
          while not document_path.exists() and time.monotonic() < deadline:
              time.sleep(1)
          assert document_path.exists(), 'Document diagnostic timed out; baseline output above remains preserved'
          assert document_path.stat().st_size < 16_000_000, 'Decoded iOS document limit'
          data = document_path.read_bytes()
          encoded = base64.b64encode(gzip.compress(data, mtime=0)).decode('ascii')
          envelope = {'encoding': 'gzip+base64', 'decodedBytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                      'base64': [encoded[i:i+4096] for i in range(0, len(encoded), 4096)]}
          wire = json.dumps(envelope, indent=2)
          assert len(wire.encode('utf8')) + result_path.stat().st_size < 4_000_000, 'Combined iOS wire limit'
          print('CURRENCY_CAMERA_DOCUMENT_IOS_JSON_BEGIN')
          print(wire)
          print('CURRENCY_CAMERA_DOCUMENT_IOS_JSON_END')
          diagnostic = json.loads(data)
          assert 'error' not in diagnostic, diagnostic
          assert diagnostic['runIdentity'] == identity and diagnostic['sourceRevision'] == os.environ['GITHUB_SHA']
          assert diagnostic['inputManifestSha256'] == ios['inputManifestSha256']
          PY
      - name: Stop the ephemeral Simulator
        if: always()
        run: |
          if [ -n "${PROOF_SIMULATOR:-}" ]; then
            xcrun simctl shutdown "$PROOF_SIMULATOR" || true
          fi
